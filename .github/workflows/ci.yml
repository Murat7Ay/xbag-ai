name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal
      - run: dotnet pack --no-build -c Release -o artifacts
      # The Redis packages are built against StackExchange.Redis 2.13 (floor); the run above tests them on 3.x.
      - run: dotnet test tests/XBag.Agents.Stores.Redis.Tests -c Release -p:TestRedisClientVersion=2.13.17
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
